<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Almoço Missionários</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--primary:#1e3a8a;--primary-light:#3b82f6;--success:#16a34a;--danger:#dc2626;--purple:#7c3aed;--bg:#f3f4f6;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--free:#dcfce7;--almoco:#dbeafe;--janta:#ede9fe;--blocked:#f3f4f6}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}.title,.actions,.row,.legend,.modal-actions{display:flex;align-items:center}.title{gap:8px;font-weight:700}.actions{gap:6px}button{font:inherit}.icon-btn{border:0;background:#ffffff24;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}.nav{background:#fff;padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.nav button{border:0;background:var(--primary-light);color:#fff;width:38px;height:38px;border-radius:50%}.nav h2{font-size:1.1rem;text-transform:capitalize}main{max-width:760px;margin:auto;padding-bottom:30px}.calendar-wrap{padding:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday{text-align:center;color:var(--muted);font-size:.7rem;font-weight:700;padding:6px 0}.day{aspect-ratio:1;border-radius:8px;padding:4px;min-height:44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.day:not(.empty):not(.blocked){cursor:pointer}.day.free{background:var(--free)}.day.almoco{background:var(--almoco)}.day.janta{background:var(--janta)}.day.both{background:linear-gradient(135deg,var(--almoco) 50%,var(--janta) 50%)}.day.blocked{background:var(--blocked);opacity:.55}.num{font-weight:700}.family{font-size:.55rem;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend{justify-content:center;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);padding:8px}.dot{width:10px;height:10px;border-radius:3px}.warning{margin:8px 16px;padding:9px 12px;border-radius:8px;background:#fef3c7;color:#92400e;font-size:.82rem}.timestamp{text-align:center;color:var(--muted);font-size:.7rem;padding:8px}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:100}.overlay.active{display:flex}.modal{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}.modal h3{color:var(--primary);margin-bottom:14px}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:1rem}.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.radio-card{border:2px solid var(--border);padding:12px;border-radius:10px}.family-list{display:flex;flex-direction:column;gap:7px;max-height:220px;overflow:auto}.family-option{padding:11px;border:2px solid var(--border);border-radius:10px;cursor:pointer}.family-option.selected{border-color:var(--primary-light);background:var(--almoco)}.modal-actions{gap:8px;margin-top:16px}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;flex:1}.primary{background:var(--primary);color:#fff}.secondary{background:var(--border)}.danger{background:var(--danger);color:#fff}.details{display:flex;flex-direction:column;gap:8px}.detail{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.detail span:last-child{font-weight:700;text-align:right}.hidden{display:none!important}.auth-ok{width:8px;height:8px;background:#22c55e;border-radius:50%;position:absolute;right:4px;top:4px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:300}.family-month-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.family-month-info{flex:1;min-width:0}.family-month-date{text-align:right;font-size:.85rem}.mini-btn{width:36px;height:36px;border:0;border-radius:9px;background:var(--border);display:grid;place-items:center;flex-shrink:0}.mini-btn svg{width:17px;height:17px}
</style></head>
<body>
<header><div class="title"><i data-lucide="utensils"></i>Almoço Missionários</div><div class="actions"><button class="icon-btn" id="shareBtn" title="Compartilhar calendário"><i data-lucide="share-2"></i></button><button class="icon-btn" id="familiesBtn" title="Famílias"><i data-lucide="users"></i></button><button class="icon-btn" id="newFamilyBtn" title="Cadastrar família" style="position:relative"><i data-lucide="user-plus"></i><span id="authBadge" class="auth-ok hidden"></span></button></div></header>
<main><div class="nav"><button id="prevBtn"><i data-lucide="chevron-left"></i></button><h2 id="monthTitle"></h2><button id="nextBtn"><i data-lucide="chevron-right"></i></button></div><section id="shareArea"><div class="calendar-wrap"><div class="calendar" id="calendar"></div></div><div class="legend"><span class="row"><span class="dot" style="background:var(--free)"></span>&nbsp;Livre</span><span class="row"><span class="dot" style="background:var(--almoco)"></span>&nbsp;Almoço</span><span class="row"><span class="dot" style="background:var(--janta)"></span>&nbsp;Janta</span><span class="row"><span class="dot" style="background:var(--blocked)"></span>&nbsp;P-Day</span></div><div class="timestamp" id="timestamp"></div></section><div class="warning" id="warning"></div></main>
<div class="overlay" id="authModal"><div class="modal"><h3>Acesso restrito</h3><p style="color:var(--muted);margin-bottom:14px">Digite a senha para alterar o calendário.</p><div class="form-group"><label for="password">Senha</label><input id="password" type="password"></div><div class="modal-actions"><button class="btn secondary close">Cancelar</button><button class="btn primary" id="loginBtn">Entrar</button></div></div></div>
<div class="overlay" id="bookingModal"><div class="modal"><h3 id="bookingTitle">Agendar</h3><div class="form-group"><label>Tipo de refeição</label><div class="radio-grid"><label class="radio-card"><input type="radio" name="meal" value="almoco" checked> Almoço</label><label class="radio-card"><input type="radio" name="meal" value="janta"> Janta</label></div></div><div class="form-group"><label>Família</label><div id="familyOptions" class="family-list"></div></div><div class="form-group"><label for="fixedType">Tipo de agendamento</label><select id="fixedType"><option value="none">Avulso</option><option value="date">Data fixa mensal</option><option value="weekday">Dia da semana fixo</option></select></div><div class="modal-actions"><button class="btn secondary close">Cancelar</button><button class="btn primary" id="saveBookingBtn">Salvar</button></div></div></div>
<div class="overlay" id="familyModal"><div class="modal"><h3>Cadastrar família</h3><div class="form-group"><label for="familyName">Nome</label><input id="familyName"></div><div class="form-group"><label for="familyPhone">WhatsApp</label><input id="familyPhone" inputmode="numeric"></div><div class="modal-actions"><button class="btn secondary close">Cancelar</button><button class="btn primary" id="saveFamilyBtn">Salvar</button></div></div></div>
<div class="overlay" id="editFamilyModal"><div class="modal"><h3>Editar dados da família</h3><div class="form-group"><label for="editFamilyName">Nome</label><input id="editFamilyName"></div><div class="form-group"><label for="editFamilyPhone">WhatsApp</label><input id="editFamilyPhone" inputmode="numeric"></div><div class="modal-actions"><button class="btn secondary close">Cancelar</button><button class="btn primary" id="updateFamilyBtn">Salvar alterações</button></div></div></div>
<div class="overlay" id="detailModal"><div class="modal"><h3>Detalhes do dia</h3><div id="detailContent" class="details"></div><div class="modal-actions"><button class="btn secondary close">Fechar</button><button class="btn primary" id="whatsappBtn">WhatsApp</button></div><div class="modal-actions"><button class="btn secondary" id="editBtn">Editar</button><button class="btn danger" id="deleteBtn">Cancelar agendamento</button></div></div></div>
<div class="overlay" id="familiesModal"><div class="modal"><h3>Famílias e agendamentos do mês</h3><div id="familiesContent" class="details"></div><div class="modal-actions"><button class="btn secondary close">Fechar</button></div></div></div><div class="toast" id="toast"></div>
<script>
const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"],WEEK=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];let current=new Date();current.setDate(1);let families=[],bookings=[],authenticated=false,pendingAction=null,selectedDate=null,selectedFamilyId=null,selectedBooking=null,editingFamilyId=null;const $=id=>document.getElementById(id),show=id=>$(id).classList.add("active"),hide=id=>$(id).classList.remove("active"),toast=msg=>{const t=$("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};
async function api(url,o={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(o.headers||{})},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||"Erro na solicitação."),{status:r.status});return d}async function checkAuth(){const d=await api("/api/auth/status");authenticated=d.authenticated;$("authBadge").classList.toggle("hidden",!authenticated)}function requireAuth(fn){if(authenticated)return fn();pendingAction=fn;$("password").value="";show("authModal");setTimeout(()=>$("password").focus(),100)}async function refresh(){[families,bookings]=await Promise.all([api("/api/families"),api(`/api/bookings?year=${current.getFullYear()}&month=${current.getMonth()+1}`)]);render()}const dateStr=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,formatDate=s=>{const[y,m,d]=s.split("-");return`${d}/${m}/${y}`};
function render(){const y=current.getFullYear(),m=current.getMonth();$("monthTitle").textContent=`${MONTHS[m]} ${y}`;const c=$("calendar");c.innerHTML="";[1,2,3,4,5,6,0].forEach(i=>{const e=document.createElement("div");e.className="weekday";e.textContent=WEEK[i];c.appendChild(e)});const f=new Date(y,m,1),l=new Date(y,m+1,0),off=(f.getDay()+6)%7;for(let i=0;i<off;i++){const e=document.createElement("div");e.className="day empty";c.appendChild(e)}let missing=0;for(let d=1;d<=l.getDate();d++){const dt=new Date(y,m,d),ds=dateStr(y,m,d),it=bookings.filter(b=>b.date===ds),lu=it.find(b=>b.type==="almoco"),di=it.find(b=>b.type==="janta"),e=document.createElement("div");e.className="day";if(dt.getDay()===1){e.classList.add("blocked");e.innerHTML=`<div class="num">${d}</div><div class="family">P-Day</div>`}else if(!it.length){e.classList.add("free");e.innerHTML=`<div class="num">${d}</div><div class="family" style="color:var(--success)">+</div>`;e.onclick=()=>requireAuth(()=>openBooking(ds))}else{e.classList.add(lu&&di?"both":lu?"almoco":"janta");e.innerHTML=`<div class="num">${d}</div>${lu?`<div class="family">☀ ${lu.familyName}</div>`:""}${di?`<div class="family">☾ ${di.familyName}</div>`:""}`;e.onclick=()=>openDay(it)}if(dt.getDay()!==1&&!lu)missing++;c.appendChild(e)}$("warning").textContent=missing?`${missing} dia${missing>1?"s":""} sem almoço agendado`:"Todos os dias têm almoço agendado!";$("timestamp").textContent=`Atualizado em ${new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}`;lucide.createIcons()}
function renderFamilyOptions(id){selectedFamilyId=id||null;$("familyOptions").innerHTML=families.length?families.map(f=>`<div class="family-option ${String(f.id)===String(id)?"selected":""}" data-id="${f.id}"><strong>${f.name}</strong><br><small>${f.phone}</small></div>`).join(""):"Nenhuma família cadastrada.";document.querySelectorAll(".family-option").forEach(e=>e.onclick=()=>{selectedFamilyId=e.dataset.id;document.querySelectorAll(".family-option").forEach(x=>x.classList.toggle("selected",x===e))})}function openBooking(ds,b=null){selectedDate=ds;selectedBooking=b;$("bookingTitle").textContent=b?`Editar ${formatDate(ds)}`:`Agendar ${formatDate(ds)}`;renderFamilyOptions(b?.familyId);document.querySelector(`input[name="meal"][value="${b?.type||"almoco"}"]`).checked=true;$("fixedType").value=b?.fixedType||"none";show("bookingModal")}
function openDay(it){if(it.length>1){$("detailContent").innerHTML=it.map(b=>`<button class="btn secondary choose" data-id="${b.id}">${b.type==="almoco"?"Almoço":"Janta"} — ${b.familyName}</button>`).join("");selectedBooking=null;["whatsappBtn","editBtn","deleteBtn"].forEach(id=>$(id).classList.add("hidden"));document.querySelectorAll(".choose").forEach(e=>e.onclick=()=>openSingle(it.find(x=>x.id===e.dataset.id)));show("detailModal")}else openSingle(it[0])}function openSingle(b){selectedBooking=b;$("detailContent").innerHTML=`<div class="detail"><span>Data</span><span>${formatDate(b.date)}</span></div><div class="detail"><span>Refeição</span><span>${b.type==="almoco"?"Almoço":"Janta"}</span></div><div class="detail"><span>Família</span><span>${b.familyName}</span></div><div class="detail"><span>Telefone</span><span>${b.phone}</span></div>`;["whatsappBtn","editBtn","deleteBtn"].forEach(id=>$(id).classList.remove("hidden"));show("detailModal")}
async function saveBooking(){if(!selectedFamilyId)return toast("Selecione uma família.");const p={familyId:selectedFamilyId,date:selectedDate,type:document.querySelector('input[name="meal"]:checked').value,fixedType:$("fixedType").value};try{selectedBooking?await api(`/api/bookings/${selectedBooking.id}`,{method:"PUT",body:JSON.stringify(p)}):await api("/api/bookings",{method:"POST",body:JSON.stringify(p)});hide("bookingModal");await refresh();toast("Agendamento salvo.")}catch(e){toast(e.message)}}async function saveFamily(){try{await api("/api/families",{method:"POST",body:JSON.stringify({name:$("familyName").value.trim(),phone:$("familyPhone").value.trim()})});hide("familyModal");await refresh();toast("Família cadastrada.")}catch(e){toast(e.message)}}
function openFamilies(){$("familiesContent").innerHTML=bookings.length?bookings.map(b=>`<div class="family-month-row"><div class="family-month-info"><strong>${b.familyName}</strong><br><small>${b.phone}</small></div><div class="family-month-date">${formatDate(b.date)}<br>${b.type==="almoco"?"Almoço":"Janta"}</div><button class="mini-btn edit-family" data-id="${b.familyId}" title="Editar família"><i data-lucide="pencil"></i></button></div>`).join(""):"Nenhum agendamento neste mês.";document.querySelectorAll(".edit-family").forEach(e=>e.onclick=()=>requireAuth(()=>openEditFamily(e.dataset.id)));show("familiesModal");lucide.createIcons()}function openEditFamily(id){const f=families.find(x=>String(x.id)===String(id));if(!f)return toast("Família não encontrada.");editingFamilyId=f.id;$("editFamilyName").value=f.name;$("editFamilyPhone").value=f.phone;hide("familiesModal");show("editFamilyModal")}async function updateFamily(){try{await api(`/api/families/${editingFamilyId}`,{method:"PUT",body:JSON.stringify({name:$("editFamilyName").value.trim(),phone:$("editFamilyPhone").value.trim()})});hide("editFamilyModal");await refresh();toast("Dados atualizados.");openFamilies()}catch(e){toast(e.message)}}
async function shareCalendar(){const b=$("shareBtn"),o=b.innerHTML;b.disabled=true;try{const c=await html2canvas($("shareArea"),{backgroundColor:"#f3f4f6",scale:Math.min(3,devicePixelRatio||2),useCORS:true}),blob=await new Promise((r,j)=>c.toBlob(x=>x?r(x):j(new Error("Erro ao gerar imagem")),"image/png")),name=`calendario-${MONTHS[current.getMonth()].toLowerCase()}-${current.getFullYear()}.png`,file=new File([blob],name,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}}catch(e){if(e.name!=="AbortError")toast(e.message)}finally{b.disabled=false;b.innerHTML=o;lucide.createIcons()}}
$("shareBtn").onclick=shareCalendar;$("prevBtn").onclick=async()=>{current.setMonth(current.getMonth()-1);await refresh()};$("nextBtn").onclick=async()=>{current.setMonth(current.getMonth()+1);await refresh()};$("newFamilyBtn").onclick=()=>requireAuth(()=>show("familyModal"));$("familiesBtn").onclick=openFamilies;$("loginBtn").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({password:$("password").value})});authenticated=true;$("authBadge").classList.remove("hidden");hide("authModal");const f=pendingAction;pendingAction=null;if(f)f()}catch(e){toast(e.message)}};$("saveBookingBtn").onclick=saveBooking;$("saveFamilyBtn").onclick=saveFamily;$("updateFamilyBtn").onclick=updateFamily;$("whatsappBtn").onclick=()=>selectedBooking&&window.open(`https://wa.me/55${selectedBooking.phone.replace(/\D/g,"")}`,"_blank");$("editBtn").onclick=()=>requireAuth(()=>{hide("detailModal");openBooking(selectedBooking.date,selectedBooking)});$("deleteBtn").onclick=()=>requireAuth(async()=>{if(selectedBooking&&confirm("Cancelar este agendamento?")){await api(`/api/bookings/${selectedBooking.id}`,{method:"DELETE"});hide("detailModal");await refresh();toast("Agendamento cancelado.")}});document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("active"));document.querySelectorAll(".overlay").forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove("active")});(async()=>{await checkAuth();await refresh()})().catch(e=>toast(e.message));
</script></body></html>
